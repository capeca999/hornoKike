  <style>
    :root {
      --night: #1f0a0d;
      --burgundy-900: #2e0f14;
      --burgundy: #561c24;
      --burgundy-700: #6b2530;
      --wheat: #c8a67e;
      --wheat-dark: #b08d62;
      --sand: #e6d5c3;
      --cream: #f7f0e7;
      --glow: #ff9a3c;
      --cycle: 12s;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font: 400 17px/1.6 "DM Sans", system-ui, sans-serif;
      color: var(--sand);
      background:
        radial-gradient(ellipse 60% 45% at 50% 58%, rgba(255, 140, 50, .16), transparent 70%),
        radial-gradient(ellipse at top, #3a1218, var(--night) 70%);
      background-color: var(--night);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    /* textura de harina */
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .5;
      background-image: radial-gradient(rgba(247, 240, 231, .07) 1px, transparent 1.4px);
      background-size: 26px 26px;
    }

    .page {
      min-height: 100%;
      display: grid; grid-template-rows: auto 1fr auto;
      width: min(1100px, 100% - 32px); margin-inline: auto;
      position: relative; z-index: 1;
    }
    header { padding: clamp(24px, 5vh, 48px) 0 0; text-align: center; }
    header img { width: clamp(150px, 22vw, 210px); height: auto; }

    main {
      display: grid; grid-template-columns: 1fr 1fr; align-items: center;
      gap: clamp(28px, 6vw, 80px); padding: clamp(24px, 5vh, 56px) 0;
    }
    @media (max-width: 820px) { main { grid-template-columns: 1fr; text-align: center; } }

    /* ---------- Texto ---------- */
    .eyebrow {
      display: inline-flex; align-items: center; gap: .7em;
      font: 700 .74rem/1 "DM Sans", sans-serif; letter-spacing: .24em; text-transform: uppercase;
      color: var(--wheat); margin: 0 0 18px;
    }
    .eyebrow::before { content: ""; width: 28px; height: 2px; background: currentColor; }
    @media (max-width: 820px) { .eyebrow::after { content: ""; width: 28px; height: 2px; background: currentColor; } }
    h1 {
      font: 900 clamp(3rem, 7.5vw, 5.6rem)/.9 "Big Shoulders Display", Impact, sans-serif;
      text-transform: uppercase; color: var(--cream); margin: 0 0 .25em; letter-spacing: .005em;
    }
    h1 em {
      display: block; font: italic 400 .62em/1.1 "Fraunces", Georgia, serif;
      text-transform: none; color: var(--wheat); letter-spacing: -.01em; margin-top: .12em;
    }
    .lead { font-size: clamp(1.02rem, 1.5vw, 1.15rem); color: rgba(230, 213, 195, .82); max-width: 460px; margin: 0 0 30px; }
    @media (max-width: 820px) { .lead { margin-inline: auto; } }

    /* Barra de progreso */
    .progress { max-width: 420px; }
    @media (max-width: 820px) { .progress { margin-inline: auto; } }
    .progress__top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
    .progress__label { font-weight: 700; color: var(--cream); font-size: .95rem; min-height: 1.5em; }
    .progress__label span { display: inline-block; animation: fadeIn .5s ease; }
    .progress__pct { font: 900 1.6rem/1 "Big Shoulders Display", sans-serif; color: var(--wheat); font-variant-numeric: tabular-nums; }
    .progress__bar { height: 10px; border-radius: 99px; background: rgba(247, 240, 231, .1); overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,.4); }
    .progress__fill {
      height: 100%; width: 0; border-radius: inherit;
      background: linear-gradient(90deg, #e9c48f, var(--glow), #d9661f);
      box-shadow: 0 0 18px rgba(255, 154, 60, .6);
      transition: width .25s linear;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } }

    /* ---------- Horno ---------- */
    .oven-wrap { display: grid; place-items: center; position: relative; }
    .oven {
      position: relative; width: min(420px, 86vw); aspect-ratio: 1 / 1.02;
      border-radius: 28px 28px 22px 22px;
      background: linear-gradient(160deg, #7a2b36 0%, var(--burgundy) 40%, #3b1218 100%);
      box-shadow:
        0 50px 80px -30px rgba(0, 0, 0, .8),
        inset 0 2px 0 rgba(255, 255, 255, .12),
        inset 0 -6px 0 rgba(0, 0, 0, .25);
      padding: 18px;
      display: grid; grid-template-rows: auto 1fr;
      gap: 16px;
    }
    /* patas */
    .oven::before, .oven::after {
      content: ""; position: absolute; bottom: -14px; width: 46px; height: 16px; border-radius: 0 0 10px 10px; background: #2a0c10;
    }
    .oven::before { left: 34px; } .oven::after { right: 34px; }

    .panel {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: rgba(0, 0, 0, .22); border-radius: 14px; padding: 12px 16px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,.4);
    }
    .knobs { display: flex; gap: 12px; }
    .knob {
      width: 34px; height: 34px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #f3e4cc, var(--wheat) 55%, var(--wheat-dark));
      box-shadow: 0 3px 6px rgba(0,0,0,.45), inset 0 -2px 3px rgba(0,0,0,.2);
      position: relative;
    }
    .knob::after { content: ""; position: absolute; left: 50%; top: 4px; width: 3px; height: 11px; margin-left: -1.5px; border-radius: 2px; background: var(--burgundy); }
    .knob:nth-child(1) { transform: rotate(-40deg); }
    .knob:nth-child(2) { animation: knob var(--cycle) linear infinite; }
    @keyframes knob { 0% { transform: rotate(-120deg); } 15%, 100% { transform: rotate(60deg); } }
    .display {
      font: 700 1.05rem/1 "Big Shoulders Display", sans-serif; letter-spacing: .06em;
      color: #ffb468; background: #140507; border-radius: 8px; padding: 8px 12px; min-width: 92px; text-align: center;
      text-shadow: 0 0 8px rgba(255, 150, 60, .8); font-variant-numeric: tabular-nums;
    }
    .lamp { width: 10px; height: 10px; border-radius: 50%; background: #ff7a2e; box-shadow: 0 0 10px 2px rgba(255, 122, 46, .8); animation: blink 2.4s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .45; box-shadow: 0 0 4px 1px rgba(255,122,46,.5); } }

    .door {
      position: relative; border-radius: 18px;
      background: linear-gradient(180deg, #4a161d, #2c0c11);
      padding: 16px; box-shadow: inset 0 2px 0 rgba(255,255,255,.08), 0 2px 0 rgba(0,0,0,.3);
      display: grid; grid-template-rows: auto 1fr;
      gap: 12px;
    }
    .handle { height: 12px; margin: 0 14%; border-radius: 99px; background: linear-gradient(180deg, #f1e2c9, var(--wheat-dark)); box-shadow: 0 4px 8px rgba(0,0,0,.45); }
    .window {
      position: relative; border-radius: 14px; overflow: hidden;
      background: radial-gradient(ellipse 80% 70% at 50% 75%, #ffb35a 0%, #ef6f1f 35%, #8f2a0e 70%, #3a0d07 100%);
      box-shadow: inset 0 0 0 3px #1a0608, inset 0 0 40px rgba(0,0,0,.55);
      animation: heat var(--cycle) ease-in-out infinite;
    }
    @keyframes heat {
      0% { filter: brightness(.45) saturate(.6); }
      12% { filter: brightness(1) saturate(1); }
      50% { filter: brightness(1.12) saturate(1.1); }
      88% { filter: brightness(1) saturate(1); }
      100% { filter: brightness(.45) saturate(.6); }
    }
    /* reflejo del cristal */
    .window::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(115deg, rgba(255,255,255,.22) 0 12%, transparent 12% 22%, rgba(255,255,255,.08) 22% 27%, transparent 27%);
    }
    /* resistencias */
    .coil { position: absolute; left: 8%; right: 8%; height: 6px; border-radius: 6px; background: #ff5a1f; box-shadow: 0 0 12px 3px rgba(255, 90, 31, .75); animation: coil 1.8s ease-in-out infinite alternate; }
    .coil--top { top: 9%; } .coil--bottom { bottom: 8%; animation-delay: -.9s; }
    @keyframes coil { from { opacity: .7; } to { opacity: 1; box-shadow: 0 0 18px 5px rgba(255, 110, 40, .9); } }
    .rack { position: absolute; left: 6%; right: 6%; bottom: 22%; height: 4px; border-radius: 4px; background: rgba(40, 10, 5, .8); box-shadow: 0 2px 0 rgba(255,180,90,.25); }

    /* Pan */
    .bread {
      position: absolute; left: 50%; bottom: calc(22% + 3px); width: 58%;
      transform-origin: 50% 100%;
      translate: -50% 0;
      animation: rise var(--cycle) cubic-bezier(.45, .05, .3, 1) infinite;
    }
    .bread svg { display: block; width: 100%; height: auto; overflow: visible; }
    .crust { animation: bake var(--cycle) ease-in-out infinite; }
    .crust-top { animation: bakeTop var(--cycle) ease-in-out infinite; }
    .score { animation: score var(--cycle) ease-in-out infinite; }
    @keyframes rise {
      0% { transform: scale(.82, .55); }
      40% { transform: scale(1, 1); }
      100% { transform: scale(1, 1); }
    }
    @keyframes bake {
      0%, 15% { fill: #f2e2c6; }
      55% { fill: #d9a35e; }
      85%, 100% { fill: #9a5524; }
    }
    @keyframes bakeTop {
      0%, 15% { fill: #f7ecd8; }
      55% { fill: #e7b56d; }
      85%, 100% { fill: #b46a2c; }
    }
    @keyframes score {
      0%, 25% { stroke: #e9d4b1; opacity: .4; }
      70%, 100% { stroke: #f6deb2; opacity: 1; }
    }

    /* Ondas de calor dentro */
    .shimmer {
      position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; opacity: .35;
      background: repeating-linear-gradient(0deg, transparent 0 10px, rgba(255, 210, 140, .18) 10px 12px);
      animation: shimmer 3s linear infinite;
    }
    @keyframes shimmer { to { background-position: 0 -48px; } }

    /* Vapor sobre el horno */
    .steam { position: absolute; top: -70px; left: 50%; width: 160px; height: 90px; translate: -50% 0; pointer-events: none; }
    .steam span {
      position: absolute; bottom: 0; width: 18px; height: 70px; border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(247, 240, 231, .5), transparent 70%);
      filter: blur(6px); opacity: 0;
      animation: steam 4s ease-in infinite;
    }
    .steam span:nth-child(1) { left: 30px; animation-delay: 0s; }
    .steam span:nth-child(2) { left: 72px; animation-delay: 1.3s; }
    .steam span:nth-child(3) { left: 112px; animation-delay: 2.6s; }
    @keyframes steam {
      0% { transform: translateY(20px) scaleX(.6); opacity: 0; }
      30% { opacity: .9; }
      100% { transform: translateY(-60px) scaleX(1.6) rotate(8deg); opacity: 0; }
    }

    /* Resplandor en el suelo */
    .floor-glow { position: absolute; bottom: -40px; left: 50%; width: 80%; height: 60px; translate: -50% 0; border-radius: 50%;
      background: radial-gradient(ellipse, rgba(255, 140, 50, .35), transparent 70%); filter: blur(10px); animation: heat var(--cycle) ease-in-out infinite; z-index: -1; }

    /* ---------- Pie ---------- */
    footer {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 28px;
      padding: 22px 0 30px; border-top: 1px solid rgba(230, 213, 195, .12);
      font-size: .92rem; color: rgba(230, 213, 195, .7);
    }
    footer strong { color: var(--wheat); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: .72rem; margin-right: 8px; }
    footer a { color: var(--cream); text-decoration: none; border-bottom: 1px solid rgba(200, 166, 126, .5); }
    footer a:hover { border-color: var(--cream); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0s !important; animation-iteration-count: 1 !important; }
      .bread { transform: none; }
      .crust { fill: #b8732f; } .crust-top { fill: #cf8b40; }
    }
  </style>
</head>

    <main>
      <section>
        <p class="eyebrow">Muy pronto</p>
        <h1>Estamos horneando<em>nuestra nueva web</em></h1>
        <p class="lead">Como el buen pan, las cosas bien hechas necesitan su tiempo. Mientras termina de cocerse, te esperamos en el horno de siempre.</p>

        <div class="progress" aria-live="polite">

            <div class="progress__fill" id="fill"></div>
          </div>
        </div>
      </section>

  <script>
    // La barra, el texto y la temperatura van sincronizados con el pan del horno
    (function () {
      var CYCLE = 12000; // igual que --cycle
      var stages = [
        [0.00, "Amasando…"],
        [0.15, "Fermentando la masa…"],
        [0.38, "Horneando…"],
        [0.62, "Dorando la corteza…"],
        [0.84, "Casi lista…"],
        [0.96, "¡Saliendo del horno!"]
      ];
      var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      var stageEl = document.getElementById("stage"), pctEl = document.getElementById("pct");
      var fill = document.getElementById("fill"), bar = document.getElementById("bar"), temp = document.getElementById("temp");
      document.getElementById("year").textContent = new Date().getFullYear();
      var last = "";
      function setStage(t) {
        if (t === last) return;
        last = t; stageEl.innerHTML = "<span>" + t + "</span>";
      }
      if (reduce) {
        fill.style.width = "85%"; pctEl.textContent = "85%"; bar.setAttribute("aria-valuenow", 85);
        setStage("Horneando…"); temp.textContent = "220°C"; return;
      }
      var t0 = performance.now();
      function tick(now) {
        var p = ((now - t0) % CYCLE) / CYCLE;
        // la barra llega al 99 %: nunca está del todo terminada ;)
        var pct = Math.min(99, Math.round(p * 104));
        fill.style.width = pct + "%";
        pctEl.textContent = pct + "%";
        bar.setAttribute("aria-valuenow", pct);
        for (var i = stages.length - 1; i >= 0; i--) if (p >= stages[i][0]) { setStage(stages[i][1]); break; }
        var c = p < 0.15 ? 20 + (p / 0.15) * 200 : 220 + Math.round(Math.sin(now / 700) * 3);
        temp.textContent = Math.round(c) + "°C";
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();
  </script>
